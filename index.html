<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614"><title>Bintang Putra A.S. — CV & Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#171614;color:#fff;font-family:Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;perspective:2400px}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:52px 18px 58px;perspective:1800px;overflow:hidden}
#book{position:relative;width:min(94vw,118vh);aspect-ratio:420/297;max-width:1500px;z-index:2;opacity:0;visibility:hidden;transform:translateZ(0);transition:opacity 90ms linear}
#coverBook{position:fixed;left:50%;top:50%;width:min(66.5vw,62.5vh);height:min(94vw,88vh);transform:translate(-50%,-50%);z-index:30;visibility:hidden;opacity:0;transition:opacity 60ms linear;pointer-events:none}
#coverBook.active{visibility:visible;opacity:1;pointer-events:auto}
#coverBook .page{width:100%;height:100%;background:#f7f5ef;overflow:hidden}
#coverBook .page img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef}
#coverBook .stf__parent{margin:auto!important}
#coverBook .stf__wrapper,#coverBook .stf__block{background:transparent!important}
#coverBook .stf__item{background:#f7f5ef!important}
#coverBook .stf__canvas{background:transparent!important}
#book.ready{visibility:visible;opacity:0}
#book.revealed{opacity:1}
.book-shadow{position:fixed;z-index:0;left:10%;right:10%;bottom:3%;height:8%;background:radial-gradient(ellipse,rgba(0,0,0,.38),transparent 70%);filter:blur(10px);pointer-events:none}
.page{width:100%;height:100%;background:#f7f5ef;overflow:hidden}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef}
.cover{display:none!important;position:fixed;z-index:30;width:min(66.5vw,62.5vh);height:min(94vw,88vh);aspect-ratio:210/297;left:50%;top:50%;transform:translate(0,-50%) rotateY(0deg) translateZ(0);transform-origin:left center;transform-style:preserve-3d;background:#f7f5ef;box-shadow:0 18px 32px rgba(0,0,0,.38),inset 0 0 0 1px rgba(0,0,0,.08);overflow:visible;visibility:hidden;cursor:pointer;will-change:transform,box-shadow;backface-visibility:visible}
.cover.ready{visibility:visible}
.cover-front,.cover-back{position:absolute;inset:0;backface-visibility:hidden}
.cover-back{transform:rotateY(180deg)}
.cover img{width:100%;height:100%;display:block;object-fit:contain}
.cover::before{content:"";position:absolute;left:-2px;top:0;width:5px;height:100%;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.10),rgba(0,0,0,.04));box-shadow:2px 0 7px rgba(0,0,0,.22);transform:translateZ(2px)}
.cover::after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;box-shadow:inset 0 0 26px rgba(0,0,0,.08)}
.cover.opening{transition:transform 1120ms cubic-bezier(.22,.72,.18,1),box-shadow 1120ms cubic-bezier(.22,.72,.18,1)}
.cover.opened{visibility:hidden!important;pointer-events:none}
.cover-shadow{display:none!important;position:fixed;z-index:29;width:min(66.5vw,62.5vh);height:min(94vw,88vh);left:50%;top:50%;transform:translate(0,-50%) rotateY(0deg) translateZ(-3px);transform-origin:left center;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.08),transparent 78%);filter:blur(4px);will-change:transform,opacity}
.cover-shadow.opening{transition:transform 1120ms cubic-bezier(.22,.72,.18,1),opacity 1120ms ease}
.hint,.counter{position:fixed;z-index:50;left:50%;transform:translateX(-50%);background:rgba(20,19,17,.66);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.74);backdrop-filter:blur(8px);border-radius:999px;letter-spacing:.13em;white-space:nowrap}
.hint{top:14px;font-size:10px;padding:8px 13px}
.counter{bottom:13px;font-size:11px;padding:7px 12px}
.nav{position:fixed;z-index:45;top:0;height:100%;width:18%;opacity:0;cursor:pointer}
.nav.left{left:0}.nav.right{right:0}
.stf__parent{margin:auto!important}
.stf__wrapper,.stf__block{background:transparent!important}
.stf__item{background:#f7f5ef!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.045)}
.stf__canvas{background:transparent!important}
@media(max-width:700px){
 .stage{padding:48px 10px 52px}
 #book{width:min(90vw,61vh);aspect-ratio:210/297}
 #coverBook{width:min(90vw,61vh);height:min(127vw,87vh)}
 .hint{top:9px;font-size:9px}.counter{bottom:9px}.nav{width:25%}
}
</style></head><body>
<div class="stage"><div id="book"></div><div id="coverBook"></div></div><div class="book-shadow"></div>
<div class="cover-shadow" id="coverShadow"></div>
<div class="cover" id="cover">
 <div class="cover-front"><img src="pages/01-cover.jpg" alt=""></div>
 <div class="cover-back"><img src="pages/02-cv.jpg" alt=""></div>
</div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="nav left" id="prev"></div><div class="nav right" id="next"></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
