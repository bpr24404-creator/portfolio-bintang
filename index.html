<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614"><title>Bintang Putra A.S. — CV & Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#171614;color:#fff;font-family:Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;perspective:2400px}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:52px 18px 58px;perspective:1800px;overflow:hidden}
#book{position:relative;width:min(94vw,118vh);aspect-ratio:420/297;max-width:1500px;z-index:2;opacity:0;visibility:hidden;transform:translateZ(0);transition:opacity 120ms linear}
#book.ready{visibility:visible;opacity:0}
#book.revealed{opacity:1}
.book-shadow{position:fixed;z-index:0;left:10%;right:10%;bottom:3%;height:8%;background:radial-gradient(ellipse,rgba(0,0,0,.38),transparent 70%);filter:blur(10px);pointer-events:none}
.page{width:100%;height:100%;background:#f7f5ef;overflow:hidden}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef}
.cover{display:none}.cover-shadow{display:none}
.hint,.counter{position:fixed;z-index:50;left:50%;transform:translateX(-50%);background:rgba(20,19,17,.66);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.74);backdrop-filter:blur(8px);border-radius:999px;letter-spacing:.13em;white-space:nowrap}
.hint{top:14px;font-size:10px;padding:8px 13px}
.counter{bottom:13px;font-size:11px;padding:7px 12px}
.nav{position:fixed;z-index:45;top:0;height:100%;width:18%;opacity:0;cursor:pointer}
.nav.left{left:0}.nav.right{right:0}
.stf__parent{margin:auto!important}
.stf__wrapper,.stf__block{background:transparent!important}
.stf__item{background:#f7f5ef!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.045)}
.stf__canvas{background:transparent!important}
@media(max-width:700px){
 .stage{padding:48px 10px 52px}
 #book{width:min(90vw,61vh);aspect-ratio:210/297}
 .cover,.cover-shadow{width:min(90vw,61vh);height:min(127vw,87vh);left:50%}
 .hint{top:9px;font-size:9px}.counter{bottom:9px}.nav{width:25%}
}
</style></head><body>
<div class="stage"><div id="book"></div></div><div class="book-shadow"></div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="nav left" id="prev"></div><div class="nav right" id="next"></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const TOTAL=17;
const book=document.getElementById('book');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');

const sources=[
 'pages/01-cover.jpg',
 'pages/02-cv.jpg',
 ...Array.from({length:15},(_,i)=>`pages/${String(i+3).padStart(2,'0')}-portfolio.jpg`)
];

let flip=null;

function setCounter(i){
 if(i<=0){counter.textContent='COVER';return}
 if(i===1){counter.textContent='CV';return}
 if(i>=16){counter.textContent='17 / 17';return}
 counter.textContent=`${i+1}–${Math.min(i+2,TOTAL)} / ${TOTAL}`;
}

function buildBook(){
 book.innerHTML='';
 const frag=document.createDocumentFragment();

 sources.forEach((src,i)=>{
   const d=document.createElement('div');
   d.className='page';
   if(i===0 || i===16)d.dataset.density='hard';

   const im=document.createElement('img');
   im.src=src;
   im.alt='';
   im.draggable=false;
   d.appendChild(im);
   frag.appendChild(d);
 });

 book.appendChild(frag);

 flip=new St.PageFlip(book,{
   width:794,
   height:1123,
   size:'stretch',
   minWidth:280,
   maxWidth:1000,
   minHeight:395,
   maxHeight:1414,
   drawShadow:true,
   maxShadowOpacity:.22,
   flippingTime:920,
   usePortrait:true,
   startPage:0,
   autoSize:true,
   showCover:true,
   mobileScrollSupport:false,
   swipeDistance:10,
   useMouseEvents:true,
   showPageCorners:true,
   disableFlipByClick:false
 });

 flip.on('init',e=>{
   setCounter(typeof e.data==='number'?e.data:0);
   hint.textContent='GESER / SENTUH UNTUK MEMBUKA';
 });

 flip.on('flip',e=>{
   setCounter(typeof e.data==='number'?e.data:0);
   hint.textContent=e.data===0
     ? 'GESER / SENTUH UNTUK MEMBUKA'
     : 'GESER / SENTUH SISI KANAN ATAU KIRI';
 });

 flip.loadFromHTML(book.querySelectorAll('.page'));
 book.classList.add('revealed');
}

document.getElementById('next').onclick=()=>{
 if(flip && flip.getCurrentPageIndex()<TOTAL-1) flip.flipNext('bottom');
};

document.getElementById('prev').onclick=()=>{
 if(flip && flip.getCurrentPageIndex()>0) flip.flipPrev('bottom');
};

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '){
   e.preventDefault();
   if(flip && flip.getCurrentPageIndex()<TOTAL-1) flip.flipNext('bottom');
 }
 if(e.key==='ArrowLeft'){
   e.preventDefault();
   if(flip && flip.getCurrentPageIndex()>0) flip.flipPrev('bottom');
 }
});

Promise.all(sources.map(src=>new Promise(resolve=>{
 const im=new Image();
 im.onload=resolve;
 im.onerror=resolve;
 im.src=src;
}))).then(buildBook);</script></body></html>
