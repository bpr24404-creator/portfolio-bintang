<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614">
<title>CV & Portfolio — Bintang Putra A.S.</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  margin:0;background:#171614;color:#fff;font-family:Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;-webkit-user-select:none;user-select:none
}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;perspective:2200px}
.book{
  position:relative;width:min(94vw,124.5vh);aspect-ratio:1.41421356/1;
  max-height:88vh;transform-style:preserve-3d;
  filter:drop-shadow(0 25px 38px rgba(0,0,0,.42))
}
.book.closed{
  width:min(66.5vw,62.25vh);aspect-ratio:.70710678/1;
  max-height:88vh
}
.spread{
  position:absolute;inset:0;display:flex;
  background:#f7f5ef;transform-style:preserve-3d
}
.page{
  position:relative;width:50%;height:100%;overflow:hidden;
  background:#f7f5ef;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)
}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef;pointer-events:none}
.page.left{box-shadow:inset -10px 0 18px rgba(0,0,0,.055)}
.page.right{box-shadow:inset 10px 0 18px rgba(0,0,0,.055)}
.spine{
  position:absolute;left:50%;top:0;width:10px;height:100%;z-index:20;
  transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(255,255,255,.25),rgba(0,0,0,.11));
  box-shadow:0 0 13px rgba(0,0,0,.12);pointer-events:none
}

/* Lightweight single-sheet flip. The underlying pages remain intact. */
.sheet{
  position:absolute;top:0;width:50%;height:100%;z-index:50;
  transform-style:preserve-3d;backface-visibility:visible;
  will-change:transform;pointer-events:none
}
.sheet.forward{left:50%;transform-origin:left center}
.sheet.backward{left:0;transform-origin:right center}
.sheet-face{
  position:absolute;inset:0;background:#f7f5ef;overflow:hidden;
  backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)
}
.sheet-face.back{transform:rotateY(180deg)}
.sheet-face img{display:block;width:100%;height:100%;object-fit:contain}
.sheet-shadow{
  position:absolute;top:0;width:50%;height:100%;z-index:45;
  pointer-events:none;opacity:0;filter:blur(6px)
}
.sheet-shadow.forward{left:50%;background:linear-gradient(90deg,rgba(0,0,0,.30),transparent 60%)}
.sheet-shadow.backward{left:0;background:linear-gradient(270deg,rgba(0,0,0,.30),transparent 60%)}

.cover{
  position:absolute;inset:0;background:#f2eee5;color:#171614;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.cover:before,.cover:after{
  content:"";position:absolute;pointer-events:none;
  border:1px solid rgba(23,22,20,.12)
}
.cover:before{inset:4.2%}.cover:after{inset:5.2%}
.cover-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(23,22,20,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,22,20,.035) 1px,transparent 1px);
  background-size:26px 26px;opacity:.45
}
.cover-content{position:relative;z-index:2;text-align:center;padding:10%;width:100%}
.cover-kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;margin-bottom:30px;opacity:.62}
.cover-title{font-family:Georgia,serif;font-size:clamp(30px,5vw,66px);line-height:.92;letter-spacing:-.035em;margin:0}
.cover-sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:25px;opacity:.7}
.cover-rule{width:52px;height:1px;background:#171614;margin:25px auto 0;opacity:.4}
.cover-mark{position:absolute;left:7%;bottom:6%;font-size:8px;letter-spacing:.18em;text-transform:uppercase;opacity:.48}
.cover-code{position:absolute;right:7%;top:6%;font-size:8px;letter-spacing:.18em;opacity:.48}

.hint,.counter{
  position:fixed;z-index:100;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.68);background:rgba(20,19,17,.62);
  border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(8px)
}
.hint{top:16px;font-size:10px;letter-spacing:.16em;padding:8px 13px;border-radius:999px;white-space:nowrap}
.counter{bottom:16px;font-size:11px;letter-spacing:.12em;padding:7px 12px;border-radius:999px}
.zone{position:fixed;z-index:90;top:0;height:100%;width:22%;opacity:0;cursor:pointer}
.zone.left{left:0}.zone.right{right:0}

@media(max-width:700px){
 body{background:#11100f}
 .book{width:min(88vw,62.23vh);aspect-ratio:.70710678/1;max-height:86vh}
 .book.closed{width:min(88vw,62.23vh);aspect-ratio:.70710678/1}
 .spread{display:block}
 .page{width:100%;display:none}
 .page.mobile-current{display:block}
 .spine{display:none}
 .sheet,.sheet.forward,.sheet.backward{left:0;width:100%;transform-origin:left center}
 .sheet-shadow,.sheet-shadow.forward,.sheet-shadow.backward{left:0;width:100%}
 .hint{top:11px;font-size:9px}.counter{bottom:11px}
}
</style>
</head>
<body>
<div class="stage"><div class="book closed" id="book"></div></div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="zone left" id="zoneLeft"></div>
<div class="zone right" id="zoneRight"></div>

<script>
const TOTAL=17;
const pages=Array.from({length:TOTAL},(_,i)=>`pages/page_${String(i+1).padStart(2,'0')}.jpg`);
const book=document.getElementById('book');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');

let open=false, spread=0, busy=false, drag=null;
const DURATION=720;
const EASE='cubic-bezier(.20,.72,.16,1)';

function img(src){return src?`<img src="${src}" draggable="false" alt="">`:''}

function cover(){
 return `<div class="cover">
   <div class="cover-grid"></div>
   <div class="cover-content">
     <div class="cover-kicker">Digital Architecture Document</div>
     <h1 class="cover-title">BINTANG<br>PUTRA A.S.</h1>
     <div class="cover-sub">CV &amp; PORTFOLIO</div>
     <div class="cover-rule"></div>
   </div>
   <div class="cover-mark">Architecture · Interior · Visualization</div>
   <div class="cover-code">A.S. / 2026</div>
 </div>`;
}

/* CLOSED = one physical A4 cover, no blank half. */
function renderClosed(){
 book.className='book closed';
 book.innerHTML='';
 const s=document.createElement('div');
 s.className='spread';
 const c=document.createElement('div');
 c.className='page';
 c.style.width='100%';
 c.innerHTML=cover();
 s.append(c);
 book.append(s);
 counter.textContent='COVER';
 hint.textContent='SENTUH / GESER UNTUK MEMBUKA';
}

/* OPEN = stable two-page spread. */
function renderSpread(){
 book.className='book';
 book.innerHTML='';
 const s=document.createElement('div');
 s.className='spread';

 const l=document.createElement('div');
 l.className='page left';
 const r=document.createElement('div');
 r.className='page right';

 const li=1+spread*2;
 const ri=li+1;
 l.innerHTML=pages[li]?img(pages[li]):'';
 r.innerHTML=pages[ri]?img(pages[ri]):'';

 if(innerWidth<=700){
   l.classList.add('mobile-current');
 }

 const spine=document.createElement('div');
 spine.className='spine';

 s.append(l,r,spine);
 book.append(s);

 counter.textContent=`${li+1}–${Math.min(ri+1,TOTAL)} / ${TOTAL}`;
 hint.textContent='GESER / SENTUH SISI KANAN ATAU KIRI';
}

function makeSheet(direction,frontSrc,backSrc){
 const s=document.querySelector('.spread');
 const sheet=document.createElement('div');
 sheet.className='sheet '+direction;
 sheet.innerHTML=
   `<div class="sheet-face front">${img(frontSrc)}</div>
    <div class="sheet-face back">${img(backSrc)}</div>`;

 const sh=document.createElement('div');
 sh.className='sheet-shadow '+direction;
 s.append(sh,sheet);

 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   sheet.style.transition=`transform ${DURATION}ms ${EASE}`;
   sh.style.transition=`opacity ${DURATION}ms ease`;
   sheet.style.transform=direction==='forward'?'rotateY(-180deg)':'rotateY(180deg)';
   sh.style.opacity='.22';
 }));

 return {sheet,sh};
}

function openBook(){
 if(busy||open)return;
 busy=true;

 /* Keep the cover as a single portrait leaf during the animation. */
 book.className='book closed';
 book.innerHTML='';
 const s=document.createElement('div');
 s.className='spread';
 const sheet=document.createElement('div');
 sheet.className='sheet forward';
 sheet.innerHTML=
   `<div class="sheet-face front">${cover()}</div>
    <div class="sheet-face back">${img(pages[1])}</div>`;
 const sh=document.createElement('div');
 sh.className='sheet-shadow forward';
 s.append(sheet,sh);
 book.append(s);

 requestAnimationFrame(()=>requestAnimationFrame(()=>{
   sheet.style.transition=`transform ${DURATION}ms ${EASE}`;
   sh.style.transition=`opacity ${DURATION}ms ease`;
   sheet.style.transform='rotateY(-180deg)';
   sh.style.opacity='.22';
 }));

 setTimeout(()=>{
   open=true;
   spread=0;
   renderSpread();
   busy=false;
 },DURATION+35);
}

function forward(){
 if(busy||!open)return;
 const next=spread+1;
 const nextLeft=1+next*2;
 if(nextLeft>=TOTAL)return;

 busy=true;
 const currentRight=2+spread*2;
 const nextLeftSrc=pages[nextLeft];

 const {sheet,sh}=makeSheet('forward',pages[currentRight],nextLeftSrc);
 setTimeout(()=>{
   spread=next;
   renderSpread();
   busy=false;
 },DURATION+35);
}

function back(){
 if(busy||!open)return;

 busy=true;

 if(spread===0){
   /* Page 2 folds back and reveals the cover. */
   const {sheet,sh}=makeSheet('backward',pages[1],null);
   sheet.querySelector('.back').innerHTML=cover();

   setTimeout(()=>{
     open=false;
     renderClosed();
     busy=false;
   },DURATION+35);
   return;
 }

 const currentLeft=1+spread*2;
 const previousRight=1+(spread-1)*2+1;

 makeSheet('backward',pages[currentLeft],pages[previousRight]);

 setTimeout(()=>{
   spread--;
   renderSpread();
   busy=false;
 },DURATION+35);
}

/* Touch/mouse drag: intentionally restrained to keep the stable layout intact. */
book.addEventListener('pointerdown',e=>{
 if(busy)return;
 drag={x:e.clientX};
});

book.addEventListener('pointerup',e=>{
 if(!drag)return;
 const dx=e.clientX-drag.x;
 drag=null;
 const threshold=Math.max(42,book.getBoundingClientRect().width*.10);

 if(!open){
   if(dx<-threshold || Math.abs(dx)<threshold) openBook();
   return;
 }
 if(dx<-threshold) forward();
 else if(dx>threshold) back();
});

book.addEventListener('pointercancel',()=>{drag=null});

zoneRight.onclick=()=>{};
document.getElementById('zoneRight').addEventListener('click',()=>open?forward():openBook());
document.getElementById('zoneLeft').addEventListener('click',()=>{if(open)back()});

document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '){
   e.preventDefault();
   open?forward():openBook();
 }
 if(e.key==='ArrowLeft'){
   e.preventDefault();
   if(open)back();
 }
});

renderClosed();
</script>
</body>
</html>
