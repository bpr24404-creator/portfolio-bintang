<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614">
<title>Bintang Putra A.S. — CV & Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#171614;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:58px 22px 62px}
#book{
 position:relative;width:min(94vw,122vh);height:min(84vh,86vw);
 max-width:1540px;max-height:1180px;
 transform:translateZ(0);
 filter:drop-shadow(0 26px 38px rgba(0,0,0,.30));
}
.book-shadow{position:fixed;z-index:0;left:10%;right:10%;bottom:4%;height:8%;background:radial-gradient(ellipse,rgba(0,0,0,.42),transparent 70%);filter:blur(12px);pointer-events:none}
#book,.stf__parent{z-index:2}
.stf__parent{margin:auto!important}
.stf__wrapper{background:transparent!important}
.stf__block{background:transparent!important}
.stf__item{
 background:#f7f5ef!important;
 box-shadow:
   inset 0 0 0 1px rgba(0,0,0,.045),
   inset 7px 0 14px rgba(0,0,0,.018),
   inset -7px 0 14px rgba(0,0,0,.018);
}
.stf__item.--left{
 box-shadow:inset -10px 0 18px rgba(0,0,0,.055),inset 0 0 0 1px rgba(0,0,0,.04);
}
.stf__item.--right{
 box-shadow:inset 10px 0 18px rgba(0,0,0,.055),inset 0 0 0 1px rgba(0,0,0,.04);
}
.stf__canvas{background:transparent!important}
.hint,.counter{position:fixed;z-index:20;left:50%;transform:translateX(-50%);background:rgba(20,19,17,.66);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.74);backdrop-filter:blur(8px);border-radius:999px;letter-spacing:.13em;white-space:nowrap}
.hint{top:16px;font-size:10px;padding:8px 13px}
.counter{bottom:15px;font-size:11px;padding:7px 12px}
.nav{position:fixed;z-index:19;top:0;height:100%;width:20%;opacity:0;cursor:pointer}
.nav.left{left:0}.nav.right{right:0}
.spine-glow{
 position:fixed;z-index:18;left:50%;top:50%;
 width:2px;height:min(84vh,86vw);max-height:1180px;
 transform:translate(-50%,-50%);
 pointer-events:none;opacity:.18;
 background:linear-gradient(180deg,transparent 2%,rgba(0,0,0,.42) 18%,rgba(255,255,255,.18) 50%,rgba(0,0,0,.42) 82%,transparent 98%);
 filter:blur(.35px);
}
@media(max-width:700px){
 .spine-glow{display:none}
 .stage{padding:50px 14px 55px}
 #book{width:min(90vw,61vh);height:min(84vh,126vw)}
 .hint{top:10px;font-size:9px}.counter{bottom:10px}.nav{width:25%}
}
</style>
</head>
<body>
<div class="stage"><div id="book"></div></div>
<div class="book-shadow"></div>
<div class="spine-glow" aria-hidden="true"></div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="nav left" id="prev"></div><div class="nav right" id="next"></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const pageFiles = ["01-cover.jpg", "02-cv.jpg", "03-portfolio.jpg", "04-portfolio.jpg", "05-portfolio.jpg", "06-portfolio.jpg", "07-portfolio.jpg", "08-portfolio.jpg", "09-portfolio.jpg", "10-portfolio.jpg", "11-portfolio.jpg", "12-portfolio.jpg", "13-portfolio.jpg", "14-portfolio.jpg", "15-portfolio.jpg", "16-portfolio.jpg", "17-portfolio.jpg"];

const TOTAL=17;
const images=pageFiles;
const book=document.getElementById('book');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');

function update(raw){
 const index = (typeof raw === 'number')
   ? raw
   : (flip && typeof flip.getCurrentPageIndex === 'function'
      ? flip.getCurrentPageIndex() : 0);

 if(index===0){
   counter.textContent='COVER';
   hint.textContent='SENTUH / GESER UNTUK MEMBUKA';
   return;
 }
 hint.textContent='GESER / SENTUH SISI KANAN ATAU KIRI';

 if(index>=16){
   counter.textContent='17 / 17';
   return;
 }

 const left=index+1;
 const right=Math.min(index+2,TOTAL);
 counter.textContent=`${left}–${right} / ${TOTAL}`;
}

const flip=new St.PageFlip(book,{
 width:794,height:1123,size:'stretch',
 minWidth:280,maxWidth:1000,minHeight:395,maxHeight:1414,
 drawShadow:true,maxShadowOpacity:.52,flippingTime:980,
 usePortrait:window.innerWidth<700,startPage:0,autoSize:true,showCover:true,
 mobileScrollSupport:true,swipeDistance:14,useMouseEvents:true,
 showPageCorners:true,disableFlipByClick:false
});

flip.on('init',e=>update(e.data));
flip.on('flip',e=>update(e.data));
flip.on('changeState',e=>{
 if(e.data==='read'){book.style.cursor='default'}
});

document.getElementById('next').onclick=()=>{if(flip.getCurrentPageIndex()<TOTAL-1)flip.flipNext('bottom')};
document.getElementById('prev').onclick=()=>{if(flip.getCurrentPageIndex()>0)flip.flipPrev('bottom')};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(flip.getCurrentPageIndex()<TOTAL-1)flip.flipNext('bottom')}
 if(e.key==='ArrowLeft'){e.preventDefault();if(flip.getCurrentPageIndex()>0)flip.flipPrev('bottom')}
});

// Use image loading rather than HTML pages: this keeps the original A4 sheets intact.
const imgs=images.map(src=>{const im=new Image();im.src=src;return im});
Promise.all(imgs.map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve())).finally(()=>{
 flip.loadFromImages(images);
});
</script>
</body>
</html>
