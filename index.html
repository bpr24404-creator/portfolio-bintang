<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614">
<title>CV & Portfolio — Bintang Putra A.S.</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#171614;color:#fff;font-family:Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;-webkit-user-select:none;user-select:none
}
.stage{
  width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
  position:relative;padding:5vh 3vw
}
#book{
  width:min(94vw,120vh);
  height:min(84vh,90vw);
  max-width:1500px;max-height:1200px;
  position:relative;
}
.page{
  background:#f7f5ef;color:#171614;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.045)
}
.page img{
  display:block;width:100%;height:100%;
  object-fit:contain;background:#f7f5ef
}
.cover{
  width:100%;height:100%;background:#f2eee5;color:#171614;
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden
}
.cover:before,.cover:after{
  content:"";position:absolute;pointer-events:none;
  border:1px solid rgba(23,22,20,.12)
}
.cover:before{inset:4.2%}.cover:after{inset:5.2%}
.cover-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(23,22,20,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,22,20,.035) 1px,transparent 1px);
  background-size:26px 26px;opacity:.45
}
.cover-content{position:relative;z-index:2;text-align:center;padding:10%;width:100%}
.cover-kicker{
  font-size:10px;letter-spacing:.32em;text-transform:uppercase;
  margin-bottom:30px;opacity:.62
}
.cover-title{
  font-family:Georgia,serif;font-size:clamp(30px,5vw,66px);
  line-height:.92;letter-spacing:-.035em;margin:0
}
.cover-sub{
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  margin-top:25px;opacity:.7
}
.cover-rule{width:52px;height:1px;background:#171614;margin:25px auto 0;opacity:.4}
.cover-mark{
  position:absolute;left:7%;bottom:6%;font-size:8px;
  letter-spacing:.18em;text-transform:uppercase;opacity:.48
}
.cover-code{
  position:absolute;right:7%;top:6%;font-size:8px;
  letter-spacing:.18em;opacity:.48
}
.hint,.counter{
  position:fixed;z-index:100;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.72);background:rgba(20,19,17,.66);
  border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(8px)
}
.hint{
  top:15px;font-size:10px;letter-spacing:.15em;padding:8px 13px;
  border-radius:999px;white-space:nowrap
}
.counter{
  bottom:15px;font-size:11px;letter-spacing:.12em;
  padding:7px 12px;border-radius:999px
}
.nav{
  position:fixed;z-index:101;top:0;height:100%;width:18%;
  opacity:0;cursor:pointer
}
.nav.left{left:0}.nav.right{right:0}
.book-shadow{
  position:fixed;inset:auto 10% 4%;height:7%;
  background:radial-gradient(ellipse,rgba(0,0,0,.38),transparent 70%);
  filter:blur(10px);pointer-events:none
}

/* StPageFlip owns the page geometry and curl animation. */
.stf__parent{margin:auto!important}
.stf__block{background:transparent!important}
.stf__item{
  background:#f7f5ef!important;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)
}
.stf__canvas{background:transparent!important}

@media(max-width:700px){
  .stage{padding:4vh 3vw}
  #book{width:min(90vw,62vh);height:min(84vh,125vw)}
  .hint{top:10px;font-size:9px}
  .counter{bottom:10px}
  .nav{width:25%}
}
</style>
</head>
<body>
<div class="stage">
  <div id="book"></div>
</div>
<div class="book-shadow"></div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="nav left" id="prev" aria-label="Halaman sebelumnya"></div>
<div class="nav right" id="next" aria-label="Halaman berikutnya"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const TOTAL=17;
const book=document.getElementById('book');
const counter=document.getElementById('counter');
const hint=document.getElementById('hint');

function coverHTML(){
  return `<div class="cover">
    <div class="cover-grid"></div>
    <div class="cover-content">
      <div class="cover-kicker">Digital Architecture Document</div>
      <h1 class="cover-title">BINTANG<br>PUTRA A.S.</h1>
      <div class="cover-sub">CV &amp; PORTFOLIO</div>
      <div class="cover-rule"></div>
    </div>
    <div class="cover-mark">Architecture · Interior · Visualization</div>
    <div class="cover-code">A.S. / 2026</div>
  </div>`;
}

const pages=[];
pages.push(`<div class="page" data-density="hard">${coverHTML()}</div>`);
for(let i=2;i<=17;i++){
  const hard=i===17?' data-density="hard"':'';
  pages.push(`<div class="page"${hard}><img src="pages/page_${String(i).padStart(2,'0')}.jpg" alt=""></div>`);
}
book.innerHTML=pages.join('');

const flip = new St.PageFlip(book,{
  width:794,
  height:1123,
  size:"stretch",
  minWidth:280,
  maxWidth:1000,
  minHeight:395,
  maxHeight:1414,
  drawShadow:true,
  maxShadowOpacity:.42,
  flippingTime:820,
  usePortrait:true,
  startPage:0,
  autoSize:true,
  showCover:true,
  mobileScrollSupport:true,
  swipeDistance:24,
  useMouseEvents:true,
  showPageCorners:true,
  disableFlipByClick:false
});

function setCounter(index){
  if(index===0){
    counter.textContent='COVER';
    hint.textContent='SENTUH / GESER UNTUK MEMBUKA';
    return;
  }
  hint.textContent='GESER / SENTUH SISI KANAN ATAU KIRI';
  if(index>=16){
    counter.textContent='17 / 17';
    return;
  }
  // In landscape, the event index is the left page of the visible spread.
  const left=index+1;
  const right=Math.min(index+2,TOTAL);
  counter.textContent=`${left}–${right} / ${TOTAL}`;
}

flip.on('init',e=>setCounter(e.data));
flip.on('flip',e=>setCounter(e.data));

document.getElementById('next').addEventListener('click',()=>{
  const i=flip.getCurrentPageIndex();
  if(i<TOTAL-1) flip.flipNext('bottom');
});
document.getElementById('prev').addEventListener('click',()=>{
  const i=flip.getCurrentPageIndex();
  if(i>0) flip.flipPrev('bottom');
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();
    if(flip.getCurrentPageIndex()<TOTAL-1) flip.flipNext('bottom');
  }
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    if(flip.getCurrentPageIndex()>0) flip.flipPrev('bottom');
  }
});

flip.loadFromHTML(document.querySelectorAll('.page'));
</script>
</body>
</html>
