<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614"><title>Bintang Putra A.S. — CV & Portfolio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#171614;color:#fff;font-family:Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:62px 24px 66px}
#book{position:relative;width:min(94vw,118.5vh);aspect-ratio:420/297;max-width:1500px;z-index:2;visibility:hidden}
#book.ready{visibility:visible}.book-shadow{position:fixed;z-index:0;left:12%;right:12%;bottom:4%;height:7%;background:radial-gradient(ellipse,rgba(0,0,0,.42),transparent 70%);filter:blur(12px);pointer-events:none}
.page{width:100%;height:100%;background:#f7f5ef;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef}
.cover{position:fixed;z-index:30;width:min(66.5vw,62.25vh);height:min(94vw,88vh);aspect-ratio:210/297;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:left center;background:#f7f5ef;box-shadow:0 22px 36px rgba(0,0,0,.42),inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden;visibility:hidden;cursor:pointer;will-change:transform,opacity}
.cover.ready{visibility:visible}.cover img{width:100%;height:100%;display:block;object-fit:contain}
.cover-front,.cover-back{position:absolute;inset:0;backface-visibility:hidden}.cover-back{transform:rotateY(180deg)}
.cover-shadow{position:fixed;z-index:29;width:min(66.5vw,62.25vh);height:min(94vw,88vh);left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:left center;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.26),rgba(0,0,0,.04),transparent 72%);filter:blur(5px);will-change:transform,opacity}
.opening{transition:transform 820ms cubic-bezier(.18,.72,.16,1),opacity 820ms ease}.opened{visibility:hidden!important;pointer-events:none}
.hint,.counter{position:fixed;z-index:50;left:50%;transform:translateX(-50%);background:rgba(20,19,17,.66);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.74);backdrop-filter:blur(8px);border-radius:999px;letter-spacing:.13em;white-space:nowrap}
.hint{top:16px;font-size:10px;padding:8px 13px}.counter{bottom:15px;font-size:11px;padding:7px 12px}.nav{position:fixed;z-index:45;top:0;height:100%;width:20%;opacity:0;cursor:pointer}.nav.left{left:0}.nav.right{right:0}
.stf__parent{margin:auto!important}.stf__wrapper,.stf__block{background:transparent!important}.stf__item{background:#f7f5ef!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.045)}.stf__canvas{background:transparent!important}
@media(max-width:700px){.stage{padding:50px 14px 55px}#book{width:min(88vw,61vh);aspect-ratio:210/297}.cover,.cover-shadow{width:min(88vw,61vh);height:min(125vw,86vh)}.hint{top:10px;font-size:9px}.counter{bottom:10px}.nav{width:25%}}
</style></head><body>
<div class="stage"><div id="book"></div></div><div class="book-shadow"></div>
<div class="cover-shadow" id="coverShadow"></div>
<div class="cover" id="cover"><div class="cover-front"><img src="pages/01-cover.jpg" alt=""></div><div class="cover-back"><img src="pages/02-cv.jpg" alt=""></div></div>
<div class="hint" id="hint">SENTUH / GESER UNTUK MEMBUKA</div><div class="counter" id="counter">COVER</div>
<div class="nav left" id="prev"></div><div class="nav right" id="next"></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const TOTAL=17, book=document.getElementById('book'),cover=document.getElementById('cover'),coverShadow=document.getElementById('coverShadow'),counter=document.getElementById('counter'),hint=document.getElementById('hint');
const sources=Array.from({length:16},(_,i)=>{const n=i+2;return `pages/${String(n).padStart(2,'0')}-${n===2?'cv':'portfolio'}.jpg`});
let flip=null,opened=false,opening=false;
function setCounter(i){if(!opened){counter.textContent='COVER';return}if(i===0){counter.textContent='CV';return}if(i>=15){counter.textContent='17 / 17';return}counter.textContent=`${i+2}–${Math.min(i+3,TOTAL)} / ${TOTAL}`}
function buildInterior(){
 book.innerHTML='';sources.forEach((src,i)=>{const d=document.createElement('div');d.className='page';if(i===15)d.dataset.density='hard';const im=document.createElement('img');im.src=src;im.alt='';im.draggable=false;d.appendChild(im);book.appendChild(d)});
 flip=new St.PageFlip(book,{width:794,height:1123,size:'stretch',minWidth:280,maxWidth:1000,minHeight:395,maxHeight:1414,drawShadow:true,maxShadowOpacity:.36,flippingTime:760,usePortrait:true,startPage:0,autoSize:true,showCover:false,mobileScrollSupport:true,swipeDistance:18,useMouseEvents:true,showPageCorners:true,disableFlipByClick:false});
 flip.on('init',e=>setCounter(e.data));flip.on('flip',e=>setCounter(e.data));flip.loadFromHTML(book.querySelectorAll('.page'));book.classList.add('ready')
}
function openCover(){if(opening||opened)return;opening=true;cover.classList.add('opening');coverShadow.classList.add('opening');requestAnimationFrame(()=>requestAnimationFrame(()=>{cover.style.transform='translate(-50%,-50%) rotateY(-180deg)';coverShadow.style.transform='translate(-50%,-50%) rotateY(-155deg)';coverShadow.style.opacity='.10'}));setTimeout(()=>{opened=true;cover.classList.add('opened');coverShadow.style.opacity='0';hint.textContent='GESER / SENTUH SISI KANAN ATAU KIRI';setCounter(0);opening=false},860)}
function closeToCover(){if(opening||!opened)return;opening=true;cover.classList.remove('opened');cover.classList.add('opening');cover.style.transform='translate(-50%,-50%) rotateY(180deg)';coverShadow.classList.add('opening');coverShadow.style.transform='translate(-50%,-50%) rotateY(155deg)';coverShadow.style.opacity='.08';requestAnimationFrame(()=>requestAnimationFrame(()=>{cover.style.transform='translate(-50%,-50%) rotateY(0deg)';coverShadow.style.transform='translate(-50%,-50%) rotateY(0deg)';coverShadow.style.opacity='0'}));setTimeout(()=>{opened=false;opening=false;hint.textContent='SENTUH / GESER UNTUK MEMBUKA';counter.textContent='COVER'},860)}
cover.addEventListener('click',openCover);
document.getElementById('next').onclick=()=>{if(!opened){openCover();return}if(flip&&flip.getCurrentPageIndex()<15)flip.flipNext('bottom')};
document.getElementById('prev').onclick=()=>{if(!opened)return;const i=flip.getCurrentPageIndex();if(i>0)flip.flipPrev('bottom');else closeToCover()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(!opened)openCover();else if(flip&&flip.getCurrentPageIndex()<15)flip.flipNext('bottom')}if(e.key==='ArrowLeft'){e.preventDefault();if(!opened)return;const i=flip.getCurrentPageIndex();if(i>0)flip.flipPrev('bottom');else closeToCover()}});
Promise.all(['pages/01-cover.jpg',...sources].map(src=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=src}))).then(()=>{buildInterior();cover.classList.add('ready')});
</script></body></html>
