<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171614">
<title>CV &amp; Portfolio — Bintang Putra A.S.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#171614;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;perspective:3000px;position:relative}
.book{position:relative;width:min(94vw,124.5vh);aspect-ratio:1.41421356 / 1;height:auto;max-height:88vh;transform-style:preserve-3d;filter:drop-shadow(0 28px 42px rgba(0,0,0,.42));transition:width .18s ease}
.book.closed{width:min(66.5vw,62.25vh);aspect-ratio:.70710678 / 1;max-width:none;max-height:88vh}
.spread{position:absolute;inset:0;display:flex;transform-style:preserve-3d;background:#f7f5ef;overflow:visible}
.page-half{position:relative;width:50%;height:100%;overflow:hidden;background:#f7f5ef;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)}
.page-half img,.face img{display:block;width:100%;height:100%;object-fit:contain;background:#f7f5ef;pointer-events:none}
.left{box-shadow:inset -12px 0 20px rgba(0,0,0,.065)}.right{box-shadow:inset 12px 0 20px rgba(0,0,0,.065)}
.spine{position:absolute;z-index:35;left:50%;top:0;width:13px;height:100%;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.28),rgba(0,0,0,.13));box-shadow:0 0 16px rgba(0,0,0,.16)}
.sheet{position:absolute;z-index:60;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;cursor:pointer;transition:transform 1.65s cubic-bezier(.18,.72,.16,1)}
.book.closed .sheet{left:0;width:100%;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#f7f5ef;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.face.back{transform:rotateY(180deg)}
.paper-shine{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.24),transparent 24%,transparent 72%,rgba(0,0,0,.10));opacity:.55}
.sheet-shadow{position:absolute;z-index:45;left:50%;top:0;width:50%;height:100%;pointer-events:none;transform-origin:left center;transition:transform 1.65s cubic-bezier(.18,.72,.16,1),opacity 1.65s ease;filter:blur(7px);background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.08),transparent 42%);opacity:.34}
.book.closed .sheet-shadow{left:0;width:100%}
.edge-shadow{position:absolute;z-index:70;left:50%;top:0;width:50%;height:100%;pointer-events:none;transform-origin:left center;transition:transform 1.65s cubic-bezier(.18,.72,.16,1);background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 22%);filter:blur(1px);opacity:.7}
.book.closed .edge-shadow{left:0;width:100%}
.cover{position:absolute;inset:0;background:#f2eee5;color:#171614;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover:before,.cover:after{content:"";position:absolute;pointer-events:none;border:1px solid rgba(23,22,20,.12)}
.cover:before{inset:4.2%;}.cover:after{inset:5.2%;}
.cover-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,22,20,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,22,20,.035) 1px,transparent 1px);background-size:26px 26px;opacity:.45}
.cover-content{position:relative;z-index:2;text-align:center;padding:10%;width:100%}
.cover-kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;margin-bottom:30px;opacity:.62}.cover-title{font-family:Georgia,serif;font-size:clamp(30px,5vw,66px);line-height:.92;letter-spacing:-.035em;margin:0}.cover-sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:25px;opacity:.7}.cover-rule{width:52px;height:1px;background:#171614;margin:25px auto 0;opacity:.4}
.cover-mark{position:absolute;left:7%;bottom:6%;font-size:8px;letter-spacing:.18em;text-transform:uppercase;opacity:.48}.cover-code{position:absolute;right:7%;top:6%;font-size:8px;letter-spacing:.18em;opacity:.48}
.hint{position:fixed;z-index:100;top:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.65);background:rgba(20,19,17,.62);padding:8px 13px;border:1px solid rgba(255,255,255,.12);border-radius:999px;backdrop-filter:blur(10px);white-space:nowrap}
.counter{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.68);background:rgba(20,19,17,.64);padding:7px 12px;border-radius:999px;backdrop-filter:blur(10px)}
.zone{position:fixed;z-index:90;top:0;height:100%;width:25%;opacity:0}.zone.left{left:0}.zone.right{right:0}
@media(max-width:700px){
 body{background:#11100f}.book{width:min(88vw,62.23vh);aspect-ratio:.70710678 / 1;max-height:86vh}.book.closed{width:min(88vw,62.23vh);aspect-ratio:.70710678 / 1;max-width:none}.spread{display:block;width:100%;height:100%}.page-half{width:100%;height:100%;display:none}.page-half.mobile-current{display:block}.spine{display:none}.sheet{left:0;width:100%;transform-origin:left center}.book.closed .sheet{left:0;width:100%}.sheet-shadow{left:0;width:100%}.edge-shadow{left:0;width:100%}.hint{top:12px;font-size:9px}.counter{bottom:12px}
}
@media(prefers-reduced-motion:reduce){.sheet,.sheet-shadow,.edge-shadow{transition-duration:.01ms}}
</style>
</head>
<body>
<div class="stage"><div class="book closed" id="book"></div></div>
<div class="hint">SENTUH / GESER UNTUK MEMBUKA</div>
<div class="counter" id="counter">COVER</div>
<div class="zone left" aria-hidden="true"></div><div class="zone right" aria-hidden="true"></div>
<script>
const pages=Array.from({length:17},(_,i)=>`pages/page_${String(i+1).padStart(2,'0')}.jpg`);
const book=document.getElementById('book'), counter=document.getElementById('counter');
let spread=0,busy=false,drag=null,closed=true;
const spreads=[];
for(let i=0;i<pages.length;i+=2) spreads.push([pages[i],pages[i+1]||'']);
function makeImg(src){return src?`<img src="${src}" draggable="false" alt="">`:''}
function makeCover(){return `<div class="cover"><div class="cover-grid"></div><div class="cover-content"><div class="cover-kicker">Digital Architecture Document</div><h1 class="cover-title">BINTANG<br>PUTRA A.S.</h1><div class="cover-sub">CV &amp; PORTFOLIO</div><div class="cover-rule"></div></div><div class="cover-mark">Architecture · Interior · Visualization</div><div class="cover-code">A.S. / 2026</div></div>`}
function buildClosed(){
 book.className='book closed';book.innerHTML='';
 const s=document.createElement('div');s.className='spread';
 const blank=document.createElement('div');blank.className='page-half left';blank.style.background='transparent';
 const right=document.createElement('div');right.className='page-half right';right.innerHTML=makeCover();
 s.append(blank,right);
 const sheet=document.createElement('div');sheet.className='sheet';
 sheet.innerHTML=`<div class="face front">${makeCover()}</div><div class="face back">${makeImg(spreads[0][0])}</div><div class="paper-shine"></div>`;
 const shadow=document.createElement('div');shadow.className='sheet-shadow';
 const edge=document.createElement('div');edge.className='edge-shadow';
 s.append(shadow,sheet,edge);book.append(s);attach(sheet,shadow,edge,true);
 counter.textContent='COVER';
}
function build(){
 book.className='book';book.innerHTML='';
 const [L,R]=spreads[spread];
 const s=document.createElement('div');s.className='spread';
 const left=document.createElement('div');left.className='page-half left mobile-current';left.innerHTML=makeImg(L);
 const right=document.createElement('div');right.className='page-half right';right.innerHTML=makeImg(R);
 s.append(left,right);
 const spine=document.createElement('div');spine.className='spine';s.append(spine);
 if(spread<spreads.length-1){
   const sheet=document.createElement('div');sheet.className='sheet';
   sheet.innerHTML=`<div class="face front">${makeImg(R)}</div><div class="face back">${makeImg(spreads[spread+1][0])}</div><div class="paper-shine"></div>`;
   const shadow=document.createElement('div');shadow.className='sheet-shadow';
   const edge=document.createElement('div');edge.className='edge-shadow';
   s.append(shadow,sheet,edge);attach(sheet,shadow,edge,false);
 }
 book.append(s);counter.textContent=`${spread*2+1}–${Math.min(spread*2+2,17)} / 17`;
}
function openBook(){
 if(busy||!closed)return;busy=true;
 const sheet=book.querySelector('.sheet'),shadow=book.querySelector('.sheet-shadow'),edge=book.querySelector('.edge-shadow');
 sheet.style.transform='rotateY(-180deg)';shadow.style.transform='rotateY(-155deg)';shadow.style.opacity='.07';edge.style.transform='rotateY(-170deg)';
 setTimeout(()=>{closed=false;spread=0;build();busy=false},1680);
}
function animateTo(next,forward){
 if(busy||closed||next<0||next>=spreads.length||next===spread)return;
 busy=true;
 const sheet=book.querySelector('.sheet'),shadow=book.querySelector('.sheet-shadow'),edge=book.querySelector('.edge-shadow');
 if(!sheet){spread=next;build();busy=false;return}
 if(forward){sheet.style.transform='rotateY(-180deg)';shadow.style.transform='rotateY(-155deg)';shadow.style.opacity='.07';edge.style.transform='rotateY(-170deg)';}
 else {sheet.style.transform='rotateY(0deg)';shadow.style.transform='rotateY(0deg)';shadow.style.opacity='.34';edge.style.transform='rotateY(0deg)';}
 setTimeout(()=>{spread=next;build();busy=false},1680);
}
function attach(sheet,shadow,edge,isCover){
 sheet.addEventListener('pointerdown',e=>{if(busy)return;drag={x:e.clientX,y:e.clientY};sheet.classList.add('dragging');sheet.setPointerCapture(e.pointerId)});
 sheet.addEventListener('pointermove',e=>{if(!drag)return;const r=sheet.getBoundingClientRect(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)<Math.abs(dy)*.55)return;const p=Math.max(0,Math.min(1,-dx/r.width));sheet.style.transform=`rotateY(${-180*p}deg)`;shadow.style.transform=`rotateY(${-155*p}deg)`;shadow.style.opacity=String(.34-.27*p);edge.style.transform=`rotateY(${-170*p}deg)`});
 sheet.addEventListener('pointerup',e=>{if(!drag)return;const r=sheet.getBoundingClientRect(),dx=e.clientX-drag.x;sheet.classList.remove('dragging');const threshold=Math.max(38,r.width*.18);drag=null;
   if(dx<-threshold){isCover?openBook():animateTo(spread+1,true)}
   else if(dx>threshold&&!isCover){animateTo(spread-1,false)}
   else{sheet.style.transform='rotateY(0deg)';shadow.style.transform='rotateY(0deg)';shadow.style.opacity='.34';edge.style.transform='rotateY(0deg)'}
 });
 sheet.addEventListener('pointercancel',()=>{drag=null;sheet.classList.remove('dragging');sheet.style.transform='rotateY(0deg)';shadow.style.transform='rotateY(0deg)';edge.style.transform='rotateY(0deg)'});
 sheet.addEventListener('click',()=>{if(isCover)openBook()});
}
document.querySelector('.zone.right').addEventListener('click',()=>{closed?openBook():animateTo(spread+1,true)});
document.querySelector('.zone.left').addEventListener('click',()=>{if(!closed)animateTo(spread-1,false)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();closed?openBook():animateTo(spread+1,true)}if(e.key==='ArrowLeft'&&!closed)animateTo(spread-1,false)});
buildClosed();
</script>
</body></html>
